[package]
name = "aptcad-engine"
description = "AptCAD engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aptcad-geom = { workspace = true }
aptcad-color = { workspace = true }
aptcad-doc = { workspace = true }
aptcad-dxf = { workspace = true }
aptcad-constraints = { workspace = true }
aptcad-fonts = { workspace = true }
aptcad-render = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
aptcad-io = { workspace = true }
